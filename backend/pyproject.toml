[project]
name = "mtf-backend"
version = "0.1.0"
description = "AI MTF Stock Recommendation Engine - backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
